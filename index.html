

        <footer>
      <p>Inkrail · digital tools for ecommerce operators</p>
      <p><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="mailto:inkrailco@gmail.com">inkrailco@gmail.com</a></p>
    </footer>
  </div>
  <script>
    (function () {
      var form = document.getElementById("home-waitlist-form");
      var input = document.getElementById("home-waitlist-email");
      var msg = document.getElementById("home-waitlist-msg");
      if (!form) return;
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = (input.value || "").trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          msg.className = "waitlist-msg err";
          msg.textContent = "Enter a valid email.";
          return;
        }
        var entry = { email: email, source: "index-waitlist", at: new Date().toISOString() };
        try {
          var list = JSON.parse(localStorage.getItem("inkrail_waitlist_intents") || "[]");
          if (!Array.isArray(list)) list = [];
          list.push(entry);
          localStorage.setItem("inkrail_waitlist_intents", JSON.stringify(list));
        } catch (_) {}
        msg.className = "waitlist-msg ok";
        msg.textContent = "Thanks — we'll follow up. Intent saved on this device.";
        var subject = encodeURIComponent("Inkrail Flow Score waitlist");
        var body = encodeURIComponent("Please add me to the Flow Score waitlist.\n\nEmail: " + email + "\n");
        setTimeout(function () {
          window.location.href = "mailto:inkrailco@gmail.com?subject=" + subject + "&body=" + body;
        }, 250);
      });
    })();
  </script>
</body>
